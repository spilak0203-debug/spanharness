name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict

  # Both implementations on each OS. pwsh is preinstalled on the Linux and macOS images; on Windows the script runs on
  # powershell.exe 5.1 (tests/run_tests.py looks for powershell.exe there), the only place the 5.1 code paths are exercised.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tests/run_tests.py --impl both -v
      # Real timings of the PowerShell recorder on powershell.exe 5.1 (a table in the log; it never fails the job).
      - name: time record on PowerShell 5.1
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: python tests/bench_record.py --impl ps1

  # The oldest supported Python (the PowerShell side is covered above).
  test-python-3-8:
    runs-on: ubuntu-22.04
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python tests/run_tests.py --impl both -v
